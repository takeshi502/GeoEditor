<style>
  :root { color-scheme: light; --blue:#1769e0; --line:#dce2ea; --muted:#667085; --bg:#f4f6f8; --danger:#c72c41; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; color:#172033; background:var(--bg); }
  button, input, textarea, select { font:inherit; }
  button { border:1px solid #b9c3d0; border-radius:7px; background:#fff; padding:7px 11px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#7f8da0; background:#f8fafc; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.danger { color:var(--danger); border-color:#e9a9b2; }
  .topbar { height:54px; display:flex; align-items:center; gap:20px; padding:0 16px; background:#fff; border-bottom:1px solid var(--line); }
  .topbar strong { font-size:18px; } .version { margin-left:8px; color:var(--muted); font-size:12px; }
  .save-state { margin-left:auto; font-size:13px; color:var(--muted); } .save-state.dirty { color:#a15c00; font-weight:600; }
  .top-actions { display:flex; gap:8px; }
  .workspace { height:calc(100% - 54px); display:grid; grid-template-columns:minmax(240px, 21%) minmax(420px, 1fr) minmax(300px, 27%); }
  .panel { background:#fff; overflow:auto; }
  .left-panel { border-right:1px solid var(--line); padding:12px; }
  .right-panel { border-left:1px solid var(--line); padding:16px; }
  .search span, .field label { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
  input, textarea, select { width:100%; border:1px solid #c7d0dc; border-radius:6px; padding:8px; background:#fff; }
  textarea { min-height:72px; resize:vertical; }
  h2 { font-size:13px; margin:18px 0 7px; display:flex; justify-content:space-between; color:#344054; }
  .item-list { display:flex; flex-direction:column; gap:4px; }
  .list-item { text-align:left; padding:8px; border:1px solid transparent; border-radius:7px; background:transparent; }
  .list-item:hover, .list-item.active { background:#eef5ff; border-color:#c8dcfb; }
  .list-title { font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list-meta { font-size:11px; color:var(--muted); display:block; margin-top:2px; }
  .map-panel { position:relative; min-width:0; }
  #map { height:100%; width:100%; z-index:0; }
  .map-toolbar { position:absolute; z-index:500; top:10px; left:50px; right:10px; display:flex; gap:8px; align-items:center; pointer-events:none; }
  .map-toolbar > * { pointer-events:auto; } #mapHint { background:rgba(255,255,255,.94); padding:7px 10px; border-radius:7px; box-shadow:0 1px 5px #0002; color:#475467; font-size:12px; }
  .toast { position:absolute; z-index:600; left:50%; bottom:20px; transform:translateX(-50%); background:#172033; color:white; padding:10px 14px; border-radius:8px; max-width:80%; }
  .editor h1 { font-size:18px; margin:0 0 14px; } .editor h3 { font-size:14px; margin:20px 0 8px; }
  .field { margin-bottom:12px; } .field.row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check { display:flex; gap:8px; align-items:center; font-size:13px; } .check input { width:auto; }
  .readonly { padding:8px; background:#f6f8fa; border-radius:6px; color:#475467; font-size:13px; word-break:break-all; }
  .point-list { display:flex; flex-direction:column; gap:5px; }
  .point-row { display:flex; width:100%; text-align:left; align-items:center; gap:8px; }
  .badge { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:#e8f1ff; color:#1459b8; font-weight:700; flex:none; }
  .warning { background:#fff4e5; border:1px solid #f3c27a; color:#7a4300; padding:9px; border-radius:7px; font-size:12px; margin:8px 0; }
  .critical { background:#ffeaed; border-color:#efa8b2; color:#912033; }
  .button-row { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
  .empty-state { color:var(--muted); padding:30px 8px; text-align:center; line-height:1.7; }
  .letter-icon { background:#1769e0; color:white; border:2px solid white; border-radius:50%; width:28px!important; height:28px!important; display:grid!important; place-items:center; font-weight:700; box-shadow:0 1px 5px #0005; }
  .candidate-icon { background:#f79009; color:white; border:2px solid white; border-radius:50%; width:20px!important; height:20px!important; box-shadow:0 1px 4px #0004; }
  @media (max-width:900px) { .workspace { grid-template-columns:220px 1fr; } .right-panel { position:absolute; right:0; top:54px; bottom:0; width:340px; z-index:700; box-shadow:-4px 0 16px #0002; } }
</style>
