<script>
(() => {
  'use strict';
  const alphabet = '0123456789bcdefghjkmnpqrstuvwxyz';

  function number(value, fallback) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : fallback;
  }

  function text(value) {
    return String(value == null ? '' : value);
  }

  function representativePoint(placeId, points) {
    return points.filter(point => point.place_id === placeId && point['有効'] !== false)
      .slice()
      .sort((a, b) => number(a['表示順'], Number.MAX_SAFE_INTEGER) - number(b['表示順'], Number.MAX_SAFE_INTEGER)
        || number(b['優先度'], 0) - number(a['優先度'], 0)
        || text(a.point_id).localeCompare(text(b.point_id)))[0] || null;
  }

  function geohash(latitude, longitude, precision) {
    const lat = number(latitude, NaN);
    const lng = number(longitude, NaN);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return 'zzzzzzz';
    let latRange = [-90, 90], lngRange = [-180, 180], even = true, bits = 0, value = 0, result = '';
    const length = precision || 7;
    while (result.length < length) {
      const range = even ? lngRange : latRange;
      const coordinate = even ? lng : lat;
      const midpoint = (range[0] + range[1]) / 2;
      value = (value << 1) | (coordinate >= midpoint ? 1 : 0);
      if (coordinate >= midpoint) range[0] = midpoint; else range[1] = midpoint;
      even = !even;
      bits += 1;
      if (bits === 5) {
        result += alphabet[value];
        bits = 0;
        value = 0;
      }
    }
    return result;
  }

  function baseName(baseId, baseAreas) {
    const base = baseAreas.find(item => text(item.base_area_id) === text(baseId)) || {};
    return text(base['基地名'] || base['base_area_name'] || base['名称'] || baseId);
  }

  function municipalityForPoint(point, municipalities) {
    if (!point) return null;
    const lat = number(point['中心緯度'], NaN);
    const lng = number(point['中心経度'], NaN);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
    return municipalities.filter(item => item['有効'] !== false)
      .filter(item => lat >= number(item.bbox_min_lat, Infinity)
        && lat <= number(item.bbox_max_lat, -Infinity)
        && lng >= number(item.bbox_min_lng, Infinity)
        && lng <= number(item.bbox_max_lng, -Infinity))
      .slice()
      .sort((a, b) => municipalityBoxArea(a) - municipalityBoxArea(b)
        || text(a.municipality_id).localeCompare(text(b.municipality_id)))[0] || null;
  }

  function municipalityBoxArea(item) {
    return Math.max(0, number(item.bbox_max_lat, 0) - number(item.bbox_min_lat, 0))
      * Math.max(0, number(item.bbox_max_lng, 0) - number(item.bbox_min_lng, 0));
  }

  function municipalityName(item) {
    return text(item && (item['市町村表示名'] || item['市町村正式名'] || item.municipality_id));
  }

  function records(places, points, baseAreas, municipalities) {
    return places.filter(place => place['有効'] !== false).map(place => {
      const point = representativePoint(place.place_id, points);
      const spatialKey = point ? geohash(point['中心緯度'], point['中心経度'], 7) : 'zzzzzzz';
      const baseId = text(place.base_area_id).trim();
      const municipality = baseId ? null : municipalityForPoint(point, municipalities || []);
      const municipalityId = text(municipality && municipality.municipality_id);
      return {
        place,
        point,
        spatialKey,
        groupKey:baseId ? `base:${baseId}` : municipalityId ? `municipality:${municipalityId}` : 'municipality:unclassified',
        groupLabel:baseId ? baseName(baseId, baseAreas) : municipality ? municipalityName(municipality) : '市町村未判定',
        groupType:baseId ? 'base' : municipality ? 'municipality' : 'unclassified'
      };
    });
  }

  function orderPlaces(places, points, baseAreas, municipalities) {
    const grouped = new Map();
    records(places, points, baseAreas, municipalities || []).forEach(record => {
      if (!grouped.has(record.groupKey)) grouped.set(record.groupKey, []);
      grouped.get(record.groupKey).push(record);
    });
    return Array.from(grouped.entries()).map(([groupKey, items]) => {
      items.sort((a, b) => a.spatialKey.localeCompare(b.spatialKey)
        || text(a.place['地点名']).localeCompare(text(b.place['地点名']), 'ja')
        || text(a.place.place_id).localeCompare(text(b.place.place_id)));
      const groupRank = items[0].groupType === 'base' ? 0 : items[0].groupType === 'municipality' ? 1 : 2;
      return { groupKey, items, groupRank, firstSpatialKey:items[0].spatialKey };
    }).sort((a, b) => a.groupRank - b.groupRank
      || a.firstSpatialKey.localeCompare(b.firstSpatialKey)
      || a.groupKey.localeCompare(b.groupKey))
      .flatMap(group => group.items);
  }

  function signature(places, points, baseAreas, municipalities) {
    const recordSignature = records(places, points, baseAreas || [], municipalities || []).map(record => {
      const place = record.place, point = record.point || {};
      return [place.place_id, place['地点名'], place.base_area_id, point.point_id, point['表示順'], point['優先度'], point['中心緯度'], point['中心経度'], record.groupKey, record.groupLabel].map(text).join('|');
    }).sort().join('\n');
    return recordSignature;
  }

  window.GeoPlaceOrder = Object.freeze({ geohash, representativePoint, municipalityForPoint, orderPlaces, signature });
})();
</script>
